<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="shortcut Icon" type="image/jpg" href="gallery.jpg"></head>
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
            font-family: 'Great Vibe', cursive;
            text-decoration: none;
            list-style: none;
        }

        body {
            background: url('images/butterfly.png') no-repeat center center fixed;
            background-size: cover;
            color: #3e2e2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            justify-content: space-between; 
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
        }

        header {
            font-family: 'Great Vibe', cursive;
            position: fixed;
            width: 100%;
            top: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 5rem;
            background-color: rgba(216, 202, 174, 0.9);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-family: 'Great Vibe', cursive;
            color: #3e2e2e;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .navmenu {
            display: flex;
        }

        .navmenu a {
            margin: 0 1.5rem;
            color: #3e2e2e;
            font-weight: 500;
            transition: all 0.3s;
        }

        .navmenu a:hover {
            color: #a52a2a;
        }

        .gallery-section {
            padding-top: 6rem;
            width: 100%;
        }

        .gallery-section h2 {
            font-size: 2rem;
            color: #3e2e2e;
            margin-bottom: 1.5rem;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        footer {
            padding: 1rem;
            background-color: rgba(216, 202, 174, 0.9);
            width: 100%;
            text-align: center;
            margin-top: 2rem; 
        }

        footer p {
            color: #3e2e2e;
        }

        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .lightbox.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox img {
            max-width: 80%;
            max-height: 80%;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(255, 255, 255, 0.5);
        }

        .lightbox .close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            font-size: 2rem;
            color: white;
            cursor: pointer;
        }
        button {
             padding: 10px 20px;
             background-color: #f5f5dc; /* Beige color */
             color: rgb(0, 0, 0);
             border: none;
             border-radius: 5px;
             font-size: 1rem;
             cursor: pointer;
             transition: background-color 0.3s ease;
             margin-top: 5rem; 
       }

      button:hover {
            background-color: #d1c8b9; 
       }

    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="#" class="logo">Amirah Qurratulela.</a>
            <nav class="navmenu">
                <a href="index.html">Home</a>
                <a href="about.html">About Me</a>
                <a href="education.html">Education</a>
                <a href="achievement.html">Achievement</a>
                <a href="gallery.html">Gallery</a>

            </nav>
        </header>

        <main>
            <button onclick="playAudio()">Play Music</button>
            <audio id="myAudio" loop>
                <source src="song2.mp3" type="audio/mp3">
            </audio>
            <section class="gallery-section" id="family">
                <h2>Family</h2>
                <div class="gallery">
                    <img src="images/family.jpg" alt="Family">
                </div>
            </section>

            <section class="gallery-section" id="friends">
                <h2>Bestfriend</h2>
                <div class="gallery">
                    <img src="images/kwn6.jpg" alt="Kwn">
                    <img src="images/kwn7.jpg" alt="Kwn 2">
                </div>
            </section>

            <section class="gallery-section" id="friends">
                <h2>Diploma and Degree Friends</h2>
                <div class="gallery">
                    <img src="images/kwn3.jpg" alt="Kwn">
                    <img src="images/kwn4.jpg" alt="Kwn 2">
                </div>
            </section>

            <section class="gallery-section" id="friends">
                <h2>Hometown's Friends</h2>
                <div class="gallery">
                    <img src="images/kwn.jpg" alt="Kwn">
                </div>
            </section>

            <section class="gallery-section" id="fiance">
                <h2>Fiance</h2>
                <div class="gallery">
                    <img src="images/abgafiq.jpg" alt="Abg Afiq">
                    <img src="images/abgafiq2.jpg" alt="Abg Afiq 2">
                </div>   
            </section>
        </main>

        <div class="lightbox" id="lightbox">
            <span class="close" id="closeLightbox">&times;</span>
            <img src="" alt="Expanded View">
        </div>

        <footer>
            <p>© 2024 Aelly Najwa.All rights reserved</p>
        </footer>
    </div>

    <script>
        const galleryImages = document.querySelectorAll('.gallery img');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = lightbox.querySelector('img');
        const closeLightbox = document.getElementById('closeLightbox');

        galleryImages.forEach(image => {
            image.addEventListener('click', () => {
                lightboxImg.src = image.src;
                lightbox.classList.add('active');
            });
        });

        closeLightbox.addEventListener('click', () => {
            lightbox.classList.remove('active');
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                lightbox.classList.remove('active');
            }
        });

        function playAudio() {
            var audio = document.getElementById('myAudio');
            audio.play();
        }
    </script>
</body>
</html>
