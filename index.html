<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="shortcut Icon" type="image/jpg" href="home.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
            font-family: 'Great Vibe', cursive;
            text-decoration: none;
            list-style: none;
        }

        body {
            margin: 0;
            color: #3e2e2e;
            font-family: 'Josefin Sans', sans-serif;
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        header {
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 5rem;
            background-color: rgba(216, 202, 174, 0.9); 
        }

        .logo {
            color: #3e2e2e;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .navmenu {
            display: flex;
        }

        .navmenu a {
            margin: 0 1.5rem;
            color: #3e2e2e;
            font-weight: 500;
            transition: all 0.3s;
        }

        .navmenu a:hover {
            color: #a52a2a;
        }

        .home {
            display: flex;
            align-items: center;
            justify-content: center; 
            height: 100vh;
            text-align: center;
            padding: 8rem 5rem 2rem 5rem;
        }

        .home-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-left: 50px; 
        }

        .home-text h2,
        .home-text h3,
        .home-text p {
            opacity: 0;
            animation: fadeIn 1.5s ease-in-out forwards;
        }

        .home-text h2 {
            font-size: 6rem;
            font-weight: bold;
            color: #a52a2a;
            margin-bottom: 0.5rem;
            animation-delay: 0s;
        }

        .home-text h3 {
            font-family: 'Great Vibes', cursive;
            font-size: 2rem;
            color: #3e2e2e;
            margin-bottom: 1rem;
            animation-delay: 0.5s;
        }

        .home-text p {
            font-size: 1.5rem;
            color: #3e2e2e;
            margin-bottom: 1rem;
            animation-delay: 1s;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(-20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .home-img img {
            max-width: 400px;
            max-height: 700px; 
            border-radius: 10px;
        }

        .social-icons a {
            margin: 0 0.5rem;
            font-size: 2rem;
            color: #3e2e2e;
            transition: transform 0.3s ease, color 0.3s ease;
            opacity: 0;
            animation: fadeIn 1.5s ease-in-out forwards;
            animation-delay: 1.5s;
        }

        .social-icons a:hover {
            transform: scale(1.2);
            color: #a52a2a;
        }

        footer {
            padding: 1rem;
            background-color: rgba(216, 202, 174, 0.9);
            width: 100%;
            text-align: center;
            margin-top: 2rem; 
        }

        footer p {
            color: #3e2e2e;
        }

        #dateTime {
            font-size: 0.9rem;
            color: #3e2e2e;
        }
    </style>
</head>
<body>
    <video id="videoBackground" autoplay muted loop>
        <source src="videos/butterfly7.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <header>
        <a href="#" class="logo">Amirah Qurratulela.</a>
        <ul class="navmenu">
            <li><a href="home.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="education.html">Education</a></li>
            <li><a href="achievement.html">Achievement</a></li>
            <li><a href="gallery.html">Gallery</a></li>
        </ul>
    </header>

    <section class="home">
        <div class="home-img">
            <img src="images/kakak3.jpg" alt="My Picture">
        </div>
        <div class="home-text">
            <h2 id="welcomeMessage">AMIRAH</h2>
            <h3 id="portfolioMessage">Portfolio</h3>
            <p id="contactMessage">Contact</p>
            <div class="social-icons">
                <a href="https://www.instagram.com/amxqrt?igsh=MWEwemt4YmZhaWN4Ng==" target="_blank">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="mailto:amirah922.asri@gmail.com">
                    <i class="fas fa-envelope"></i>
                </a>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2024 Aelly Najwa.All rights reserved</p>
        <p id="dateTime"></p>
    </footer>

    <script>
        window.addEventListener('load', function() {
            function updateDateTime() {
                const dateTimeElement = document.getElementById('dateTime');
                const options = {
                    timeZone: 'Asia/Kuching',
                    year: 'numeric',
                    month: 'numeric',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                };
                const currentDateTime = new Date().toLocaleString('en-GB', options);
                dateTimeElement.textContent = currentDateTime;
            }
            setInterval(updateDateTime, 1000);
        });
    </script>
</body>
</html>
